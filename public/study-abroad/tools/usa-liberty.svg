<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 230" fill="none" role="img" aria-hidden="true">
  <!-- Flat Statue of Liberty for the USA country card. Drawn in-house. -->

  <!-- torch flame -->
  <path d="M118 22 C126 12 122 4 118 0 C118 8 108 10 108 20 C108 27 112 31 118 31 C123 31 127 27 127 20 C127 16 125 13 123 12 C123 17 118 18 118 22 Z" fill="#f5b52e"/>
  <!-- torch cup + handle -->
  <rect x="108" y="31" width="20" height="7" rx="3.5" fill="#1d8f8a"/>
  <rect x="114" y="38" width="8" height="18" rx="3" fill="#2ab3ab"/>

  <!-- raised right arm -->
  <path d="M112 52 L124 56 L98 108 L84 100 Z" fill="#2ab3ab"/>

  <!-- head -->
  <circle cx="75" cy="86" r="15" fill="#2ab3ab"/>
  <!-- crown band and spikes -->
  <rect x="60" y="72" width="30" height="7" rx="3.5" fill="#1d8f8a"/>
  <g fill="#1d8f8a">
    <path d="M73 70 L77 70 L75 54 Z"/>
    <path d="M62 72 L66 71 L58 58 Z"/>
    <path d="M84 71 L88 72 L92 58 Z"/>
    <path d="M52 76 L55 73 L42 66 Z"/>
    <path d="M95 73 L98 76 L108 66 Z"/>
  </g>

  <!-- body robe -->
  <path d="M58 104 L92 104 L112 230 L38 230 Z" fill="#2ab3ab"/>
  <!-- robe folds -->
  <path d="M70 116 L76 230 L66 230 Z" fill="#1d8f8a" opacity="0.55"/>
  <path d="M88 120 L100 230 L90 230 Z" fill="#1d8f8a" opacity="0.4"/>
  <!-- sash across the robe -->
  <path d="M58 108 L92 104 L96 126 L56 132 Z" fill="#1d8f8a"/>

  <!-- left arm holding the tablet -->
  <path d="M60 108 L48 112 L38 146 L52 150 Z" fill="#1d8f8a"/>
  <rect x="26" y="128" width="26" height="34" rx="4" fill="#2ab3ab"/>
  <rect x="30" y="134" width="18" height="3" rx="1.5" fill="#e9fbf8" opacity="0.8"/>
  <rect x="30" y="141" width="18" height="3" rx="1.5" fill="#e9fbf8" opacity="0.6"/>
</svg>
