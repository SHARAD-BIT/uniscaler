<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 230" fill="none" role="img" aria-hidden="true">
  <!-- Flat Berlin TV tower with a small skyline for the Germany card.
       Drawn in-house. -->

  <!-- skyline blocks -->
  <g>
    <rect x="8" y="176" width="30" height="54" fill="#a8cdf0"/>
    <rect x="38" y="158" width="26" height="72" fill="#bcd9f2"/>
    <rect x="104" y="166" width="28" height="64" fill="#bcd9f2"/>
    <rect x="132" y="184" width="30" height="46" fill="#a8cdf0"/>
    <!-- windows -->
    <g fill="#7fb0dc">
      <rect x="14" y="184" width="6" height="8"/>
      <rect x="26" y="184" width="6" height="8"/>
      <rect x="14" y="200" width="6" height="8"/>
      <rect x="26" y="200" width="6" height="8"/>
      <rect x="44" y="166" width="6" height="8"/>
      <rect x="54" y="166" width="6" height="8"/>
      <rect x="44" y="182" width="6" height="8"/>
      <rect x="54" y="182" width="6" height="8"/>
      <rect x="44" y="198" width="6" height="8"/>
      <rect x="110" y="174" width="6" height="8"/>
      <rect x="120" y="174" width="6" height="8"/>
      <rect x="110" y="190" width="6" height="8"/>
      <rect x="120" y="190" width="6" height="8"/>
      <rect x="138" y="192" width="6" height="8"/>
      <rect x="150" y="192" width="6" height="8"/>
      <rect x="138" y="208" width="6" height="8"/>
    </g>
  </g>

  <!-- antenna with red bands -->
  <rect x="82" y="6" width="6" height="52" fill="#c9ced4"/>
  <rect x="82" y="6" width="6" height="8" fill="#e8564a"/>
  <rect x="82" y="26" width="6" height="8" fill="#e8564a"/>

  <!-- sphere -->
  <clipPath id="sphere">
    <circle cx="85" cy="82" r="26"/>
  </clipPath>
  <circle cx="85" cy="82" r="26" fill="#d7dbe0"/>
  <g clip-path="url(#sphere)">
    <rect x="59" y="66" width="52" height="3" fill="#b3b9c0"/>
    <rect x="59" y="74" width="52" height="3" fill="#b3b9c0"/>
    <rect x="59" y="90" width="52" height="3" fill="#b3b9c0"/>
    <rect x="59" y="98" width="52" height="3" fill="#b3b9c0"/>
    <rect x="59" y="81" width="52" height="6" fill="#e8564a"/>
  </g>

  <!-- shaft, widening slightly towards the ground -->
  <path d="M80 106 L90 106 L98 230 L72 230 Z" fill="#c9ced4"/>
  <path d="M85 106 L90 106 L98 230 L85 230 Z" fill="#b3b9c0"/>
</svg>
