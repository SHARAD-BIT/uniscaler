  <path d="M250 156l12-20" stroke="#c98862" stroke-width="7" stroke-linecap="round"/>
  <rect x="228" y="190" width="9" height="24" rx="4.5" fill="#10194f"/>
  <rect x="243" y="190" width="9" height="24" rx="4.5" fill="#10194f"/>
