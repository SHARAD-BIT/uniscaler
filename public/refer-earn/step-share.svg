  <!-- sound + chat flying across -->
  <path d="M158 84c8 2 12 8 12 14" stroke="#8090ed" stroke-width="4" stroke-linecap="round"/>
  <path d="M162 68c14 4 20 14 20 24" stroke="#8090ed" stroke-width="4" stroke-linecap="round"/>
  <rect x="176" y="96" width="42" height="26" rx="8" fill="#4b62e8"/>
  <circle cx="189" cy="109" r="3" fill="#ffffff"/>
  <circle cx="198" cy="109" r="3" fill="#ffffff"/>
  <circle cx="207" cy="109" r="3" fill="#ffffff"/>
  <path d="M182 122l-4 9 12-6z" fill="#4b62e8"/>
  <!-- paper plane -->
  <path d="M226 66l30 8-24 12 0-8z" fill="#f7b64a"/>
  <path d="M226 66l6 12 0 8-6-4z" fill="#e09a2e"/>

  <!-- right person catching the message -->
