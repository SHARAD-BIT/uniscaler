  <circle cx="50" cy="74" r="6" fill="#c5d0f7"/>
  <circle cx="272" cy="58" r="7" fill="#c5d0f7"/>
  <circle cx="286" cy="170" r="5" fill="#d9e1fb"/>
  <path d="M262 210c8-1 13-8 14-16 1 8 6 15 14 16-8 1-13 8-14 16-1-8-6-15-14-16z" fill="#adb6ea"/>

  <!-- left person with megaphone -->
  <circle cx="86" cy="96" r="15" fill="#f2b28c"/>
  <path d="M75 88c3-9 19-9 22 0-4-5-18-5-22 0z" fill="#10194f"/>
  <path d="M66 168c0-26 9-40 20-40s20 14 20 40z" fill="#f75d34"/>
  <rect x="72" y="168" width="10" height="26" rx="5" fill="#10194f"/>
  <rect x="90" y="168" width="10" height="26" rx="5" fill="#10194f"/>
  <!-- arm up holding the megaphone -->
  <path d="M100 138l16-18" stroke="#f2b28c" stroke-width="8" stroke-linecap="round"/>
  <path d="M114 104l26-12 6 34-26-6a14 14 0 0 1-6-16z" fill="#4b62e8"/>
