<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Definitions for Gradients & Shadow Effects -->
  <defs>
    <!-- Background Circle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D4D" />
      <stop offset="100%" stop-color="#B30000" />
    </linearGradient>

    <!-- Cap & Accents Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFE5E5" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#800000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Base Circular Background -->
  <circle cx="256" cy="256" r="230" fill="url(#bgGrad)" />

  <!-- Outer Decorative Ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.3" stroke-dasharray="8 8" />

  <!-- Main Icon Group -->
  <g filter="url(#dropShadow)">
    <!-- Globe Lines (Latitude/Longitude) -->
    <circle cx="256" cy="270" r="120" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-opacity="0.9" />
    <ellipse cx="256" cy="270" rx="55" ry="120" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-opacity="0.7" />
    <line x1="136" y1="270" x2="376" y2="270" stroke="#FFFFFF" stroke-width="10" stroke-opacity="0.7" />
    <line x1="156" y1="210" x2="356" y2="210" stroke="#FFFFFF" stroke-width="8" stroke-opacity="0.5" />
    <line x1="156" y1="330" x2="356" y2="330" stroke="#FFFFFF" stroke-width="8" stroke-opacity="0.5" />

    <!-- Airplane Flying Path (Dotted) -->
    <path d="M 120 330 A 170 170 0 0 1 370 150" fill="none" stroke="#FFE5E5" stroke-width="6" stroke-dasharray="10 10" stroke-linecap="round" />

    <!-- Airplane -->
    <g transform="translate(365, 140) rotate(35)">
      <path d="M 0 0 L -24 20 L -18 8 L -36 4 L -38 -6 L -18 -2 L -24 -14 Z" fill="url(#accentGrad)" />
    </g>

    <!-- Graduation Cap (Mortarboard) -->
    <g id="graduation-cap">
      <!-- Cap Base / Skullcap -->
      <path d="M 196 160 Q 256 180 316 160 L 316 190 Q 256 215 196 190 Z" fill="#FFFFFF" opacity="0.95" />
      
      <!-- Diamond Top -->
      <polygon points="256,105 356,145 256,185 156,145" fill="url(#accentGrad)" stroke="#B30000" stroke-width="3" />
      
      <!-- Tassel Button -->
      <circle cx="256" cy="145" r="7" fill="#B30000" />
      
      <!-- Tassel String & Fringe -->
      <path d="M 256 145 Q 330 150 335 185" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
      <polygon points="331,185 339,185 335,205" fill="#FFFFFF" />
    </g>
  </g>
</svg>
