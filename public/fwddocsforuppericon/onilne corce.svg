<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Red Gradient -->
    <linearGradient id="redBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B30" />
      <stop offset="100%" stop-color="#990000" />
    </linearGradient>

    <!-- Screen Inner Gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFEBEE" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#4A0000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Circular Background -->
  <circle cx="256" cy="256" r="230" fill="url(#redBg)" />

  <!-- Outer Dashed Ring -->
  <circle cx="256" cy="256" r="198" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="8 8" opacity="0.35" />

  <g filter="url(#shadow)">
    <!-- Laptop Base -->
    <path d="M 110 350 L 402 350 C 418 350, 426 360, 416 368 L 396 380 C 390 384, 380 384, 372 384 L 140 384 C 132 384, 122 384, 116 380 L 96 368 C 86 360, 94 350, 110 350 Z" fill="#E0E0E0" />
    <path d="M 220 350 L 292 350 L 286 356 L 226 356 Z" fill="#9E9E9E" />

    <!-- Laptop Screen Outer Body -->
    <rect x="130" y="180" width="252" height="170" rx="12" fill="#FFFFFF" stroke="#D32F2F" stroke-width="4" />
    
    <!-- Screen Display Area -->
    <rect x="142" y="192" width="228" height="144" rx="6" fill="url(#screenGrad)" />

    <!-- Video Play Button Icon on Screen -->
    <circle cx="256" cy="264" r="32" fill="#D32F2F" />
    <polygon points="248,248 272,264 248,280" fill="#FFFFFF" />

    <!-- Progress / Control Bar Below Video -->
    <rect x="162" y="312" width="188" height="6" rx="3" fill="#FFCDD2" />
    <rect x="162" y="312" width="110" height="6" rx="3" fill="#D32F2F" />
    <circle cx="272" cy="315" r="5" fill="#B71C1C" />

    <!-- Graduation Cap Top Overlay -->
    <g transform="translate(0, -10)">
      <!-- Cap Base / Skullcap -->
      <path d="M 210 140 Q 256 155 302 140 L 302 162 Q 256 182 210 162 Z" fill="#B71C1C" />
      
      <!-- Diamond Top -->
      <polygon points="256,90 340,125 256,160 172,125" fill="#FFFFFF" stroke="#B71C1C" stroke-width="4" />
      
      <!-- Button & Tassel -->
      <circle cx="256" cy="125" r="6" fill="#B71C1C" />
      <path d="M 256 125 Q 315 130 320 160" fill="none" stroke="#FFD700" stroke-width="4" stroke-linecap="round" />
      <polygon points="316,160 324,160 320,175" fill="#FFD700" />
    </g>

    <!-- Signal / Wi-Fi Waves (Online Indicator) -->
    <path d="M 360 140 A 24 24 0 0 1 384 164" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
    <path d="M 370 130 A 38 38 0 0 1 408 168" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.7" />
  </g>
</svg>
