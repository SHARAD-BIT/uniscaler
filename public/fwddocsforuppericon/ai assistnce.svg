<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Red Gradient -->
    <linearGradient id="aiRedBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B30" />
      <stop offset="100%" stop-color="#800000" />
    </linearGradient>

    <!-- Metallic Accent Gradient -->
    <linearGradient id="robotFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFEBEE" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#4A0000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Circular Background -->
  <circle cx="256" cy="256" r="230" fill="url(#aiRedBg)" />

  <!-- Outer Dashed Orbit Ring -->
  <circle cx="256" cy="256" r="198" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="8 8" opacity="0.35" />

  <g filter="url(#shadow)">
    <!-- Antenna Pin & Light -->
    <line x1="256" y1="140" x2="256" y2="175" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />
    <circle cx="256" cy="130" r="14" fill="#FFD700" stroke="#FFFFFF" stroke-width="4" />

    <!-- Robot Ears (Left & Right Buttons) -->
    <rect x="120" y="240" width="24" height="50" rx="10" fill="#FFFFFF" opacity="0.9" />
    <rect x="368" y="240" width="24" height="50" rx="10" fill="#FFFFFF" opacity="0.9" />

    <!-- Robot Head Body -->
    <rect x="136" y="170" width="240" height="190" rx="48" fill="url(#robotFace)" stroke="#D32F2F" stroke-width="6" />

    <!-- Visor Display Screen -->
    <rect x="160" y="200" width="192" height="100" rx="28" fill="#B71C1C" />

    <!-- AI Glowing Eyes -->
    <circle cx="208" cy="250" r="18" fill="#FFFFFF" />
    <circle cx="208" cy="250" r="8" fill="#FFD700" />
    
    <circle cx="304" cy="250" r="18" fill="#FFFFFF" />
    <circle cx="304" cy="250" r="8" fill="#FFD700" />

    <!-- Friendly Smile Line -->
    <path d="M 216 320 Q 256 345 296 320" fill="none" stroke="#D32F2F" stroke-width="7" stroke-linecap="round" />

    <!-- AI Sparkles (Magic Assistant Effect) -->
    <!-- Top Right Sparkle -->
    <path d="M 375 120 L 382 138 L 400 145 L 382 152 L 375 170 L 368 152 L 350 145 L 368 138 Z" fill="#FFD700" />
    <!-- Bottom Left Sparkle -->
    <path d="M 125 350 L 130 363 L 143 368 L 130 373 L 125 386 L 120 373 L 107 368 L 120 363 Z" fill="#FFD700" />
  </g>
</svg>
