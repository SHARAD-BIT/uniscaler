<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E53935" />
      <stop offset="100%" stop-color="#8E0000" />
    </linearGradient>

    <!-- Coin Gradient -->
    <linearGradient id="coinGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FF9800" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#4A0000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Circular Base -->
  <circle cx="256" cy="256" r="230" fill="url(#bgRed)" />

  <!-- Outer Dashed Orbit Ring -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="8 8" opacity="0.4" />

  <g filter="url(#shadow)">
    <!-- Connection Arc (Arrow) -->
    <path d="M 170 240 A 100 100 0 0 1 340 240" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-dasharray="12 8" />
    <polygon points="345,240 330,225 335,250" fill="#FFFFFF" />

    <!-- User 1 (Sender - Left) -->
    <g transform="translate(140, 270)">
      <circle cx="0" cy="-30" r="28" fill="#FFFFFF" />
      <path d="M -45 40 C -45 5, -25 -5, 0 -5 C 25 -5, 45 5, 45 40 Z" fill="#FFFFFF" />
    </g>

    <!-- User 2 (Receiver - Right) -->
    <g transform="translate(372, 270)">
      <circle cx="0" cy="-30" r="28" fill="#FFFFFF" opacity="0.9" />
      <path d="M -45 40 C -45 5, -25 -5, 0 -5 C 25 -5, 45 5, 45 40 Z" fill="#FFFFFF" opacity="0.9" />
    </g>

    <!-- Center Reward Coin -->
    <g transform="translate(256, 175)">
      <!-- Outer Coin Glow -->
      <circle cx="0" cy="0" r="45" fill="url(#coinGold)" stroke="#FFFFFF" stroke-width="5" />
      <circle cx="0" cy="0" r="35" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="4 4" opacity="0.7" />
      <!-- Dollar Sign -->
      <text x="0" y="14" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#7A4300" text-anchor="middle">$</text>
    </g>

    <!-- Sparkles -->
    <path d="M 190 140 L 195 155 L 210 160 L 195 165 L 190 180 L 185 165 L 170 160 L 185 155 Z" fill="#FFD700" />
    <path d="M 315 130 L 318 140 L 328 143 L 318 146 L 315 156 L 312 146 L 302 143 L 312 140 Z" fill="#FFD700" />
  </g>
</svg>
